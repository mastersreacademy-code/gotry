name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npx wrangler deploy --dry-run --outdir dist
      - run: npx playwright install --with-deps chromium
      - run: npx wrangler d1 migrations apply gotry-ci --local --config wrangler.ci.jsonc
      - run: npm run e2e